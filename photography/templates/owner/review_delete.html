<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Review</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card Container -->
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
        
        <!-- Header Banner with Icon -->
        <div class="p-6 text-center border-b border-gray-100">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
                <!-- Alert/Trash Icon -->
                <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold text-gray-900">Delete Approved Review</h1>
            <p class="text-sm text-gray-500 mt-1">Are you sure you want to delete this review? This action cannot be undone.</p>
        </div>

        <!-- Review Content Card -->
        <div class="p-6 bg-gray-50/50">
            <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                <div class="flex items-center space-x-3 mb-2">
                    <!-- User Avatar Placeholder -->
                    <div class="h-8 w-8 rounded-full bg-indigo-100 text-indigo-600 font-semibold flex items-center justify-center text-sm">
                        {{ review.name|slice:":1"|upper }}
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold text-gray-900">{{ review.name }}</h3>
                        <span class="inline-flex items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20">Approved</span>
                    </div>
                </div>
                <p class="text-sm text-gray-600 italic leading-relaxed">
                    "{{ review.comment }}"
                </p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="p-6 bg-white border-t border-gray-100 flex flex-col sm:flex-row-reverse gap-3">
            <form method="POST" class="w-full sm:w-auto">
                {% csrf_token %}
                <button type="submit" class="w-full inline-flex justify-center items-center px-4 py-2.5 bg-red-600 text-white font-medium text-sm rounded-lg hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors shadow-sm">
                    Yes, Delete Review
                </button>
            </form>

            <a href="{% url 'owner_reviews' %}" class="w-full sm:w-auto inline-flex justify-center items-center px-4 py-2.5 bg-white border border-gray-300 text-gray-700 font-medium text-sm rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                Cancel
            </a>
        </div>

    </div>

</body>
</html>
