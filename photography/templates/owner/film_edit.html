<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Wedding Film | Studio Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        
        /* Form styling enhancements for Django form fields */
        form p {
            margin-bottom: 1.25rem;
        }
        form label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a1a1aa;
            margin-bottom: 0.5rem;
        }
        form input[type="text"],
        form input[type="url"],
        form input[type="number"],
        form input[type="file"],
        form select,
        form textarea {
            width: 100%;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #f4f4f5;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }
        form input:focus, form select:focus, form textarea:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.15);
        }
        form textarea {
            min-height: 120px;
            resize: vertical;
        }
        form .helptext {
            display: block;
            font-size: 0.75rem;
            color: #71717a;
            margin-top: 0.35rem;
        }
        form ul.errorlist {
            list-style: none;
            padding: 0;
            margin: 0.35rem 0 0 0;
            color: #f87171;
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 md:p-10 selection:bg-amber-500/30 selection:text-amber-200 flex flex-col justify-center">

    <div class="max-w-3xl mx-auto w-full space-y-6">

        <!-- Top Back Navigation -->
        <div>
            <a href="{% url 'owner_films' %}" class="inline-flex items-center space-x-2 text-xs font-medium text-amber-400 hover:text-amber-300 transition group">
                <i class="fa-solid fa-arrow-left text-[11px] group-hover:-translate-x-1 transition-transform"></i>
                <span>Back to Film List</span>
            </a>
        </div>

        <!-- Main Card Container -->
        <div class="bg-zinc-900/60 backdrop-blur-md border border-zinc-800/90 rounded-2xl shadow-2xl p-6 md:p-8 relative overflow-hidden">
            
            <!-- Header Section -->
            <div class="flex items-center space-x-4 pb-6 mb-6 border-b border-zinc-800/80">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-amber-500/20 to-amber-200/10 border border-amber-500/20 text-amber-400 flex items-center justify-center text-xl shrink-0">
                    <i class="fa-solid fa-film"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-serif font-bold text-white tracking-wide">Edit Wedding Film</h1>
                    <p class="text-zinc-400 text-xs mt-0.5">Modify video metadata, description links, or replace media files.</p>
                </div>
            </div>

            <!-- Form -->
            <form method="post" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}

                <!-- Rendered Django Form Inputs -->
                <div class="space-y-4">
                    {{ form.as_p }}
                </div>

                <!-- Form Action Buttons -->
                <div class="flex flex-col sm:flex-row items-center justify-end gap-3 pt-6 mt-6 border-t border-zinc-800/80">
                    <a href="{% url 'owner_films' %}" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-semibold text-center transition">
                        Cancel
                    </a>
                    
                    <button type="submit" class="w-full sm:w-auto inline-flex items-center justify-center space-x-2 px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-zinc-950 font-bold text-xs shadow-lg shadow-amber-500/15 transition cursor-pointer">
                        <i class="fa-solid fa-check text-[11px]"></i>
                        <span>Update Film</span>
                    </button>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
