<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Photography Package</title>
    <!-- Modern Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-main: #dc2626;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --danger-hover: #b91c1c;
            --btn-secondary-bg: #f1f5f9;
            --btn-secondary-text: #334155;
            --btn-secondary-hover: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 8px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            line-height: 1.5;
        }

        .delete-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            text-align: center;
        }

        .icon-wrapper {
            width: 56px;
            height: 56px;
            background-color: var(--danger-bg);
            color: var(--danger-main);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        .icon-wrapper svg {
            width: 28px;
            height: 28px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        .confirmation-message {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }

        .package-name {
            color: var(--text-main);
            font-weight: 600;
        }

        .warning-box {
            background-color: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-main);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .actions {
            display: flex;
            flex-direction: column-reverse;
            gap: 0.75rem;
        }

        @media (min-width: 400px) {
            .actions {
                flex-direction: row;
            }
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-cancel {
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
        }

        .btn-cancel:hover {
            background-color: var(--btn-secondary-hover);
            color: var(--text-main);
        }

        .btn-danger {
            background-color: var(--danger-main);
            color: #ffffff;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .form-wrapper {
            flex: 1;
            display: flex;
        }

        .form-wrapper button {
            width: 100%;
        }
    </style>
</head>
<body>

    <main class="delete-card">
        <!-- Warning Icon -->
        <div class="icon-wrapper" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
        </div>

        <h1>Delete Photography Package</h1>

        <p class="confirmation-message">
            Are you sure you want to delete the 
            <span class="package-name">{{ package.get_name_display }}</span> package?
        </p>

        <div class="warning-box">
            This action is permanent and cannot be undone.
        </div>

        <div class="actions">
            <!-- Secondary/Safe Action (Cancel) -->
            <a href="{% url 'owner_packages' %}" class="btn btn-cancel">
                Cancel
            </a>

            <!-- Primary/Destructive Action (Delete) -->
            <form method="POST" class="form-wrapper">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    Delete Package
                </button>
            </form>
        </div>
    </main>

</body>
</html>
